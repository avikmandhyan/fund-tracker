name: Fetch NSE Bhavcopy

on:
  schedule:
    - cron: '0 15 * * 1-5'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch bhavcopies
        run: python3 fetch_bhav.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bhav_today.csv bhav_week.csv bhav_month.csv bhav_today_date.txt bhav_week_date.txt bhav_month_date.txt
          git diff --staged --quiet || git commit -m "Auto-update bhavcopy $(date -u +'%Y-%m-%d')"
          git push
